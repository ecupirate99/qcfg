<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saturday Scoreboard — College Football</title>
<style>
  :root{
    --field-green:#0d3b26;
    --field-green-dark:#082418;
    --chalk:#f2efe6;
    --hash:#3f6b52;
    --gold:#e8b84b;
    --live-red:#d1453b;
    --muted:#a9c2b3;
    --card-bg:#0f2f21;
    --card-border:#1e4a35;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Georgia', 'Times New Roman', serif;
    background:
      repeating-linear-gradient(
        0deg,
        var(--field-green),
        var(--field-green) 48px,
        var(--field-green-dark) 48px,
        var(--field-green-dark) 50px
      );
    color:var(--chalk);
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    padding:28px 20px 18px;
    text-align:center;
    border-bottom:3px solid var(--gold);
    background:rgba(4,20,13,0.55);
  }
  header h1{
    margin:0;
    font-size:1.6rem;
    letter-spacing:0.5px;
    font-weight:700;
  }
  header .sub{
    margin-top:6px;
    color:var(--muted);
    font-size:0.85rem;
    font-family:Arial, sans-serif;
  }
  .refresh-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:12px;
    font-family:Arial, sans-serif;
  }
  .refresh-row button{
    background:var(--gold);
    border:none;
    color:#1c1200;
    font-weight:700;
    padding:7px 14px;
    border-radius:20px;
    font-size:0.8rem;
    cursor:pointer;
  }
  .refresh-row button:active{ transform:scale(0.97); }
  #status-line{
    font-size:0.75rem;
    color:var(--muted);
  }
  .search-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:14px;
    max-width:420px;
    margin-left:auto;
    margin-right:auto;
    font-family:Arial, sans-serif;
  }
  #team-search{
    flex:1;
    padding:10px 14px;
    border-radius:20px;
    border:1px solid var(--card-border);
    background:rgba(0,0,0,0.25);
    color:var(--chalk);
    font-size:0.9rem;
    outline:none;
  }
  #team-search::placeholder{ color:var(--muted); }
  #team-search:focus{ border-color:var(--gold); }
  #clear-search{
    background:transparent;
    border:1px solid var(--card-border);
    color:var(--muted);
    width:34px;
    height:34px;
    border-radius:50%;
    font-size:0.85rem;
    cursor:pointer;
    flex-shrink:0;
    display:none;
  }
  #clear-search.visible{ display:block; }
  .no-results{
    text-align:center;
    color:var(--muted);
    font-family:Arial, sans-serif;
    margin-top:40px;
    padding:0 20px;
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:18px 14px;
  }
  .empty, .error{
    text-align:center;
    color:var(--muted);
    font-family:Arial, sans-serif;
    margin-top:40px;
    padding:0 20px;
  }
  .game-card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:10px;
    margin-bottom:16px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.35);
  }
  .game-status{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 14px;
    font-family:Arial, sans-serif;
    font-size:0.72rem;
    letter-spacing:0.4px;
    background:rgba(0,0,0,0.25);
  }
  .game-status .live{
    color:var(--live-red);
    font-weight:700;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .live-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--live-red);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.3;}
  }
  .game-status .final{ color:var(--muted); font-weight:700; }
  .game-status .broadcast{ color:var(--muted); }

  .teams{ padding:10px 14px 6px; }
  .team-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 0;
  }
  .team-left{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .team-logo{
    width:30px;height:30px;
    object-fit:contain;
    flex-shrink:0;
  }
  .team-badge{
    width:30px;height:30px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, sans-serif;
    font-size:0.6rem;
    font-weight:700;
    color:#fff;
    text-shadow:0 1px 1px rgba(0,0,0,0.4);
    letter-spacing:0.3px;
  }
  .team-name{
    font-size:0.98rem;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .team-record{
    font-family:Arial, sans-serif;
    font-size:0.68rem;
    color:var(--muted);
    margin-left:6px;
    white-space:nowrap;
  }
  .team-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .ball-icon{
    font-size:0.95rem;
    line-height:1;
  }
  .team-score{
    font-size:1.25rem;
    font-weight:700;
    min-width:28px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .team-row.trailing .team-score{ color:var(--muted); }

  .stars{
    border-top:1px dashed var(--card-border);
    padding:10px 14px 12px;
    font-family:Arial, sans-serif;
  }
  .stars-label{
    font-size:0.65rem;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--gold);
    margin-bottom:6px;
    font-weight:700;
  }
  .star-item{
    font-size:0.78rem;
    color:var(--chalk);
    padding:5px 0;
    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .star-item .star-emoji{ flex-shrink:0; font-size:0.95rem; line-height:1.3; }
  .star-item .star-text{ min-width:0; }
  .star-item .star-name{ font-weight:700; display:block; }
  .star-item .star-team{ color:var(--gold); font-weight:400; }
  .star-item .star-stat{ color:var(--muted); display:block; margin-top:1px; }

  footer{
    text-align:center;
    color:var(--muted);
    font-family:Arial, sans-serif;
    font-size:0.7rem;
    margin-top:20px;
    padding:0 20px;
  }

  @media (max-width:380px){
    .team-name{ font-size:0.88rem; }
    .team-score{ font-size:1.1rem; }
    header h1{ font-size:1.35rem; }
  }
</style>
</head>
<body>

<header>
  <h1>🏈 Saturday Scoreboard</h1>
  <div class="sub" id="date-sub">College Football — Today's Games</div>
  <div class="refresh-row">
    <button id="refresh-btn">Refresh</button>
    <span id="status-line"></span>
  </div>
  <div class="search-row">
    <input type="text" id="team-search" placeholder="Search a team…" autocomplete="off">
    <button id="clear-search" aria-label="Clear search">✕</button>
  </div>
</header>

<main id="main-content">
  <div class="empty">Loading today's games…</div>
</main>

<footer>Data from ESPN's public scoreboard API · Auto-refreshes every 30s while a tab is open</footer>

<script>
// NOTE ON PREVIEWING WITH REAL DATA
// -----------------------------------------------------------------------------
// Claude.ai artifacts run in a sandboxed iframe that blocks live fetch() calls
// to outside domains (like ESPN). That's why an earlier version of this file
// showed game cards with no scores: the request never actually reached ESPN.
//
// On a real website (your own server, GitHub Pages, etc.) that sandbox
// restriction does NOT apply, and the live fetch below works exactly as
// written. To let you preview the real design *inside* this artifact, we're
// temporarily using a hard-coded snapshot of real ESPN data (pulled directly,
// outside the sandbox) instead of a live call. Flip USE_LIVE_FETCH to true
// once you're running this outside claude.ai.

const USE_LIVE_FETCH = true;
const API_URL = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard";
const mainEl = document.getElementById('main-content');
const statusLine = document.getElementById('status-line');
const dateSub = document.getElementById('date-sub');

function formatDate(){
  const d = new Date();
  return d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}
dateSub.textContent = "College Football — " + formatDate();

// Map ESPN leader categories to friendly labels + emoji
const CATEGORY_META = {
  passingYards: { label:"Passing", emoji:"🎯" },
  rushingYards: { label:"Rushing", emoji:"🏃" },
  receivingYards: { label:"Receiving", emoji:"🙌" }
};

function pickOffensiveStars(competition, away, home){
  const leaders = competition.leaders || [];
  const stars = [];
  // Map each team's abbreviation to its full display name, so we can label
  // each star with a real team name instead of trusting nested athlete data.
  const nameByAbbrev = {};
  [away, home].forEach(c => {
    const abbrev = (c.team.abbreviation || "").toUpperCase();
    if(abbrev) nameByAbbrev[abbrev] = c.team.shortDisplayName || c.team.displayName || abbrev;
  });
  leaders.forEach(cat => {
    const meta = CATEGORY_META[cat.name];
    if(!meta) return; // skip defensive categories etc.
    const top = (cat.leaders && cat.leaders[0]) ? cat.leaders[0] : null;
    if(!top) return;
    const athlete = top.athlete || {};
    const rawAbbrev = ((athlete.team && athlete.team.abbreviation) || (top.team && top.team.abbreviation) || "").toUpperCase();
    stars.push({
      emoji: meta.emoji,
      label: meta.label,
      name: athlete.shortName || athlete.displayName || "Unknown",
      teamName: nameByAbbrev[rawAbbrev] || rawAbbrev || "",
      stat: top.displayValue || ""
    });
  });
  return stars;
}

function renderGame(event){
  const comp = event.competitions[0];
  const status = comp.status || event.status;
  const state = status.type.state; // 'pre', 'in', 'post'
  const competitors = comp.competitors || [];
  // ESPN orders home/away via homeAway field; sort so away shown first (traditional)
  const away = competitors.find(c => c.homeAway === 'away') || competitors[0];
  const home = competitors.find(c => c.homeAway === 'home') || competitors[1];

  const awayScore = parseInt(away.score || "0", 10);
  const homeScore = parseInt(home.score || "0", 10);

  let statusHtml = "";
  if(state === 'pre'){
    const time = new Date(event.date).toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
    statusHtml = `<span>${time}</span>`;
  } else if(state === 'in'){
    const period = status.period;
    const clock = status.displayClock;
    const periodLabel = period === 1 ? "1st" : period === 2 ? "2nd" : period === 3 ? "3rd" : period === 4 ? "4th" : `OT${period > 4 ? (period-4) : ''}`;
    statusHtml = `<span class="live"><span class="live-dot"></span>LIVE — ${periodLabel} ${clock}</span>`;
  } else {
    statusHtml = `<span class="final">FINAL${status.type.detail && status.type.detail.includes('OT') ? ' / OT' : ''}</span>`;
  }

  const broadcast = (comp.broadcasts && comp.broadcasts[0] && comp.broadcasts[0].names && comp.broadcasts[0].names[0]) || "";

  function teamRow(team, otherScore, thisScore){
    const winningOrLeading = (state !== 'pre') && (thisScore > otherScore);
    const isTrailing = (state !== 'pre') && (thisScore < otherScore);
    const name = team.team.shortDisplayName || team.team.displayName;
    const abbrev = team.team.abbreviation || name.slice(0,4).toUpperCase();
    const color = team.team.color ? `#${team.team.color}` : '#3f6b52';
    const logo = team.team.logo || "";
    const record = (team.records && team.records[0]) ? team.records[0].summary : "";
    // Try the real ESPN logo first; if it 404s or fails to load, swap in the
    // colored abbreviation badge automatically so a layout is never broken.
    const badgeHtml = logo
      ? `<img class="team-logo" src="${logo}" alt="${name} logo"
           onerror="this.outerHTML='<span class=&quot;team-badge&quot; style=&quot;background:${color}&quot;>${abbrev}</span>'">`
      : `<span class="team-badge" style="background:${color}">${abbrev}</span>`;
    return `
      <div class="team-row ${isTrailing ? 'trailing' : ''}">
        <div class="team-left">
          ${badgeHtml}
          <span class="team-name">${name}</span>
          <span class="team-record">${record}</span>
        </div>
        <div class="team-right">
          ${winningOrLeading ? '<span class="ball-icon" title="Winning / Leading">🏈</span>' : ''}
          <span class="team-score">${state === 'pre' ? '' : thisScore}</span>
        </div>
      </div>`;
  }

  const stars = pickOffensiveStars(comp, away, home);
  const starsHtml = stars.length ? `
    <div class="stars">
      <div class="stars-label">Offensive Stars</div>
      ${stars.map(s => `
        <div class="star-item">
          <span class="star-emoji">${s.emoji}</span>
          <span class="star-text">
            <span class="star-name">${s.name}${s.teamName ? ' <span class="star-team">— '+s.teamName+'</span>' : ''}</span>
            <span class="star-stat">${s.label}: ${s.stat}</span>
          </span>
        </div>`).join('')}
    </div>` : '';

  return `
    <div class="game-card">
      <div class="game-status">
        ${statusHtml}
        <span class="broadcast">${broadcast}</span>
      </div>
      <div class="teams">
        ${teamRow(away, homeScore, awayScore)}
        ${teamRow(home, awayScore, homeScore)}
      </div>
      ${starsHtml}
    </div>`;
}

let ALL_EVENTS = [];

async function loadScores(){
  statusLine.textContent = "Updating…";
  try{
    let data;
    if(USE_LIVE_FETCH){
      const res = await fetch(API_URL);
      if(!res.ok) throw new Error("Network response was not ok");
      data = await res.json();
    } else {
      // Simulate a brief network delay so the loading state is visible
      await new Promise(r => setTimeout(r, 400));
      data = SNAPSHOT_DATA;
    }
    const events = data.events || [];
    ALL_EVENTS = events;

    applySearch();
    const now = new Date();
    statusLine.textContent = "Updated " + now.toLocaleTimeString();
  } catch(err){
    mainEl.innerHTML = `<div class="error">Couldn't load scores right now. Pull to refresh or tap the Refresh button.<br><br><small>${err.message}</small></div>`;
    statusLine.textContent = "Update failed";
  }
}

function renderEventsList(events){
  if(events.length === 0){
    mainEl.innerHTML = `<div class="empty">No games scheduled today. Check back on gameday!</div>`;
    return;
  }
  // Sort: live games first, then upcoming, then final
  const stateOrder = { in: 0, pre: 1, post: 2 };
  const sorted = [...events].sort((a,b) => {
    const sa = a.competitions[0].status.type.state;
    const sb = b.competitions[0].status.type.state;
    return (stateOrder[sa] ?? 3) - (stateOrder[sb] ?? 3);
  });
  mainEl.innerHTML = sorted.map(renderGame).join('');
}

function applySearch(){
  const query = teamSearchInput.value.trim().toLowerCase();
  clearSearchBtn.classList.toggle('visible', query.length > 0);

  if(!query){
    renderEventsList(ALL_EVENTS);
    return;
  }

  const filtered = ALL_EVENTS.filter(event => {
    const comp = event.competitions[0];
    return comp.competitors.some(c => {
      const name = (c.team.shortDisplayName || c.team.displayName || "").toLowerCase();
      const abbrev = (c.team.abbreviation || "").toLowerCase();
      return name.includes(query) || abbrev.includes(query);
    });
  });

  if(filtered.length === 0){
    mainEl.innerHTML = `<div class="no-results">No games found for "${teamSearchInput.value.trim()}".</div>`;
  } else {
    renderEventsList(filtered);
  }
}

const teamSearchInput = document.getElementById('team-search');
const clearSearchBtn = document.getElementById('clear-search');
teamSearchInput.addEventListener('input', applySearch);
clearSearchBtn.addEventListener('click', () => {
  teamSearchInput.value = '';
  applySearch();
  teamSearchInput.focus();
});

document.getElementById('refresh-btn').addEventListener('click', loadScores);
loadScores();
setInterval(loadScores, 30000);
</script>
